name: Aurora CI

on:
  push:
    branches: ["main", "portfolio-cleanup"]
  pull_request:
    branches: ["main"]

jobs:
  validation:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Check whitespace
        run: git diff --check

      - name: Validate repository hygiene
        shell: python
        run: |
          from pathlib import Path

          forbidden = ("C:\\Users\\", "D:\\", "C:\\Program Files\\")
          files = [
              Path("config/settings.py"),
              Path("llm/local_llm.py"),
              Path("seguranca/mensageiro_telegram.py"),
          ]

          for path in files:
              text = path.read_text(encoding="utf-8")
              for marker in forbidden:
                  if marker in text:
                      raise SystemExit(f"Caminho de máquina encontrado em {path}: {marker}")

          if Path(".env").exists():
              raise SystemExit(".env real não pode estar presente no repositório.")
