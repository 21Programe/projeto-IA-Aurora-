name: Aurora CI

on:
  push:
    branches: ["main", "portfolio-cleanup"]
  pull_request:
    branches: ["main"]

jobs:
  validation:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install minimal validation dependencies
        run: python -m pip install python-dotenv

      - name: Compile Python modules
        run: python -m compileall -q .

      - name: Run configuration tests
        run: python -m unittest tests.test_settings
